<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Котолэндинг</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
    }
    header {
      padding: 2rem;
      text-align: center;
      background: #000;
      color: #fff;
    }
    section {
      padding: 2rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border: 2px solid #000;
      filter: grayscale(100%);
    }
    form {
      display: flex;
      flex-direction: column;
      max-width: 400px;
      margin: 2rem auto;
    }
    form input, form textarea, form button {
      margin-bottom: 1rem;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #000;
    }
    form button {
      background: #000;
      color: #fff;
      cursor: pointer;
    }
    #search {
      display: block;
      margin: 2rem auto;
      padding: 0.75rem;
      font-size: 1rem;
      width: 80%;
      border: 1px solid #000;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Добро пожаловать на Котолэндинг</h1>
    <p>Поиск по тексту и милым котикам 🐾</p>
  </header>

  <input type="text" id="search" placeholder="Поиск по тексту и картинкам...">

  <section id="content">
    <h2>О котах</h2>
    <p>Коты — удивительные существа. Они мягкие, пушистые и любят лежать в самых неожиданных местах.</p>

    <h2>Почему мы любим котов</h2>
    <p>Они мурлыкают, когда им хорошо, и всегда знают, где уютнее всего.</p>

    <h2>Галерея котов</h2>
    <div class="gallery" id="catGallery">
      <img src="https://loremflickr.com/320/240/persian,cat?random=1" alt="Персидский котик">
      <img src="https://loremflickr.com/320/240/bengal,cat?random=2" alt="Бенгальский котик">
      <img src="https://loremflickr.com/320/240/siamese,cat?random=3" alt="Сиамский котик">
      <img src="https://loremflickr.com/320/240/mainecoon,cat?random=4" alt="Мейн-кун">
    </div>
  </section>

  <section>
    <h2>Связаться с нами</h2>
    <form>
      <input type="text" placeholder="Ваше имя" required>
      <input type="email" placeholder="Email" required>
      <textarea rows="5" placeholder="Сообщение"></textarea>
      <button type="submit">Отправить</button>
    </form>
  </section>

  <script>
    const searchInput = document.getElementById('search');
    const content = document.getElementById('content');
    const images = document.querySelectorAll('#catGallery img');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();

      // Поиск по тексту
      [...content.querySelectorAll('p, h2')].forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(query) ? 'block' : 'none';
      });

      // Поиск по alt-тексту картинок
      images.forEach(img => {
        img.style.display = img.alt.toLowerCase().includes(query) ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
